<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>계약학과 경쟁률 모니터</title><style>
body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f6f7fb;margin:0;color:#202124}.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 50px}h1{margin:0 0 8px;font-size:28px}.sub{color:#6b7280;margin-bottom:22px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 3px 14px rgba(0,0,0,.04)}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.badge{font-size:13px;background:#eefbf4;color:#087443;padding:6px 10px;border-radius:999px}.badge.changed{background:#fff4e5;color:#9a4b00}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #eee}th{color:#6b7280;font-size:13px}td:last-child,th:last-child{text-align:right}.ratio{font-weight:700}.source{font-size:13px;color:#6b7280}.footer{margin-top:22px;color:#7b8190;font-size:12px}.btn{display:inline-block;padding:7px 10px;border:1px solid #ddd;border-radius:8px;color:#333;text-decoration:none;background:#fff}
 .rowchanged{background:#fff7ed}.rowchanged td{font-weight:600}
</style></head><body><main class="wrap"><h1>계약학과 경쟁률 모니터</h1><div class="sub">진학어플라이 + 유웨이 · 5분마다 확인 · 화면은 15초마다 새 데이터 확인</div><div id="app">불러오는 중…</div><div class="footer">※ 원서접수 사이트가 제공하는 공식 경쟁률을 자동 조회합니다. 두 원본 사이트 모두 경쟁률을 10분 단위로 업데이트하므로, 이 대시보드는 새 데이터가 올라오면 최대한 빠르게 반영합니다.</div></main><script>
async function load(){try{const r=await fetch('data/data.json?t='+Date.now(),{cache:'no-store'});const d=await r.json();let html='';const badge=d.changed?'<span class="badge changed">최근 확인에서 변동</span>':'<span class="badge">최근 확인에서 변동 없음</span>';
html+=`<div class="card"><div class="head"><div><b>마지막 확인</b> ${d.updated_at}</div>${badge}</div></div>`;
html+=`<div class="card"><div class="head"><h2>진학어플라이</h2><a class="btn" href="${d.sources[0].url}" target="_blank">원본 보기</a></div><div class="source">계약학과 채용조건형 특별전형 경쟁률 현황</div><table><thead><tr><th>모집단위</th><th>모집인원</th><th>지원인원</th><th>경쟁률</th></tr></thead><tbody>`;
for(const x of d.jinhak) html+=`<tr class="${x.changed?'rowchanged':''}"><td>${x.name}</td><td>${x.recruit}</td><td>${x.applicants}</td><td class="ratio">${x.ratio}</td></tr>`;html+='</tbody></table></div>';
html+=`<div class="card"><div class="head"><h2>유웨이</h2><a class="btn" href="${d.sources[1].url}" target="_blank">원본 보기</a></div><div class="source">(충남형) 리안헤어뷰티아트학과 · 미창조(주) 리안헤어</div><table><thead><tr><th>모집단위</th><th>모집인원</th><th>지원인원</th><th>경쟁률</th></tr></thead><tbody>`;
for(const x of d.uway) html+=`<tr class="${x.changed?'rowchanged':''}"><td>${x.name}</td><td>${x.recruit}</td><td>${x.applicants}</td><td class="ratio">${x.ratio}</td></tr>`;html+='</tbody></table></div>';document.getElementById('app').innerHTML=html;}catch(e){document.getElementById('app').innerHTML='<div class="card">데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>';}}load();setInterval(load,15000);
</script></body></html>
